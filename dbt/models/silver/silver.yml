version: 2

models:
  - name: silver_companies
    description: Cleaned company master data from the Bronze layer.
    columns:
      - name: symbol
        tests: [not_null, unique]
      - name: is_bank
        tests: [not_null]
      - name: source
        tests: [not_null]

  - name: silver_stock_prices
    description: Deduplicated daily adjusted prices (thousand VND).
    columns:
      - name: symbol
        tests: [not_null]
      - name: trading_date
        tests: [not_null]
      - name: source
        tests: [not_null]
      - name: close
        tests: [not_null]

  - name: silver_financial_statements
    description: Typed quarterly financial statement metrics.
    columns:
      - name: symbol
        tests: [not_null]
      - name: report_period
        tests: [not_null]
      - name: report_year
        tests: [not_null]
      - name: report_quarter
        tests: [not_null]
      - name: available_date
        description: quarter_end_date + 45 days; the earliest date the report is safe to use.
        tests: [not_null]
      - name: source
        tests: [not_null]

  - name: silver_foreign_trading
    description: Latest daily snapshot of foreign buy/sell volumes per symbol (history starts at first pipeline run).
    columns:
      - name: symbol
        tests: [not_null]
      - name: trading_date
        tests: [not_null]
      - name: foreign_buy_vol
        tests: [not_null]
      - name: foreign_sell_vol
        tests: [not_null]