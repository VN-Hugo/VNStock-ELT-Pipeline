version: 2

models:
  - name: dim_companies
    description: Company dimension for the analytics star schema.
    columns:
      - name: symbol
        tests: [not_null, unique]
      - name: exchange
        tests:
          - accepted_values:
              arguments:
                values: ["HOSE", "HNX", "UPCOM", "UNKNOWN"]
      - name: source
        tests: [not_null]

  - name: fact_stock_prices
    description: >
      Daily prices with returns, moving averages, 20-day volatility and traded value.
      Foreign volumes are NULL before the pipeline started snapshotting the price board.
    columns:
      - name: symbol
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_companies')
                field: symbol
      - name: trading_date
        tests: [not_null]
      - name: source
        tests: [not_null]
      - name: daily_return

  - name: dim_date
    description: Calendar dimension generated from the Silver stock price date range.
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: year
        tests: [not_null]
      - name: quarter
        tests: [not_null]
      - name: is_trading_day
        tests: [not_null]

  - name: fact_financial_statements
    description: >
      Quarterly financials with valuation (P/E, P/B), profitability and YoY growth.
      Join to daily prices on available_date to avoid look-ahead bias.
    columns:
      - name: symbol
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_companies')
                field: symbol
      - name: report_period
        tests: [not_null]
      - name: report_year
        tests: [not_null]
      - name: report_quarter
        tests: [not_null]
      - name: source
        tests: [not_null]
      - name: profit_margin

  - name: gold_market_summary
    description: Symbol-level market summary aggregated from daily Silver prices.
    columns:
      - name: symbol
        tests: [not_null]
      - name: source
        tests: [not_null]
      - name: latest_trading_date
        tests: [not_null]

  - name: mart_stock_daily
    description: >
      Wide daily table for BI: prices, technical features, company attributes and the latest
      financials already public on each day (point-in-time join on available_date).
      pe_daily / pb_daily = daily market cap over the TTM earnings / book value implied by the
      latest reported P/E and P/B.
    columns:
      - name: symbol
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_companies')
                field: symbol
      - name: trading_date
        tests: [not_null]
      - name: market_cap_vnd
        description: Adjusted close x 1000 x current shares outstanding.
      - name: latest_report_period
        description: Quarter whose financials were public on trading_date (NULL before the first one).
